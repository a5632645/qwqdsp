<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>piwarp5 复刻 — 参数矩阵 / 波形 / 时频图</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>piwarp5 复刻 <span class="sub">(Kaiser 窗 + 帧内时间反转 + 重叠相加, M=32 / hop=31)</span></h1>
  <div class="signal-controls">
    <label>白噪声种子
      <input type="number" id="seed-input" value="305419896" step="1">
    </label>
    <label>扫频起
      <input type="number" id="f0-input" value="20" step="1"> Hz
    </label>
    <label>扫频止
      <input type="number" id="f1-input" value="20000" step="100"> Hz
    </label>
    <label>时长
      <input type="number" id="dur-input" value="10" step="0.5"> s
    </label>
    <button id="regenerate-btn">重新生成输入</button>
    <span id="status"></span>
  </div>
</header>

<main class="columns">
  <section class="col">
    <div class="row-label">① 参数设定 (第 0 列为原始输入)</div>
    <div class="col-stack" id="params-col"></div>
  </section>

  <section class="col">
    <div class="row-label">② 白噪声输出</div>
    <div class="col-stack" id="noise-col"></div>
  </section>

  <section class="col">
    <div class="row-label">③ 扫频输出</div>
    <div class="col-stack" id="sweep-col"></div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
